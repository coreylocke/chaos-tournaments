# Nginx reverse proxy for Chaos Tournaments (Next.js on port 3000 via Docker)
# Copy to /etc/nginx/sites-available/chaostournaments.com on the VPS,
# then: ln -s /etc/nginx/sites-available/chaostournaments.com /etc/nginx/sites-enabled/
# Replace chaostournaments.com with your real domain before use.

server {
    listen 80;
    listen [::]:80;
    server_name chaostournaments.com www.chaostournaments.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this is working over HTTP, run:
#   certbot --nginx -d chaostournaments.com -d www.chaostournaments.com
# Certbot will rewrite this file to add the HTTPS server block and redirect.
