services:
  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - BOT_INTERNAL_URL=http://bot:4001
    expose:
      - "3000"
    depends_on:
      - bot

  bot:
    build: ./bot
    restart: always
    env_file:
      - .env

  lockeinvestments:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - /var/www/lockeinvestments:/usr/share/nginx/html:ro
      - ./site-confs/lockeinvestments.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
      lockeinvestments:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
